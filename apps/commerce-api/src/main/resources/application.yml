server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
  task:
    scheduling:
      pool:
        size: 3 # QueueAdmissionScheduler(1s), OutboxEventRelay(3s), 일별 랭킹 배치(1일 1회)가 스레드 부족으로 서로 지연시키지 않도록

order:
  placed:
    topic-name: order.placed.topic-v1
  rate-limit:
    capacity: 50 # 부하테스트로 확인한 안전 처리량(초당 50건)을 그대로 사용
    refill-per-sec: 50

coupon:
  issue:
    topic-name: coupon.issue.topic-v1

product:
  liked:
    topic-name: product.liked.topic-v1
  unliked:
    topic-name: product.unliked.topic-v1

outbox:
  relay:
    fixed-delay-ms: 3000
    batch-size: 100

queue:
  admission:
    fixed-delay-ms: 1000
    batch-size: 40

ranking:
  # commerce-streamer의 ranking.weight와 반드시 같은 값 유지 (DailyRankingBatchScheduler가 동일 산식으로 재계산함)
  weight:
    order: 0.8
    like: 0.2
  daily-batch:
    cron: "0 10 0 * * *"

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

pg:
  url: http://localhost:8082
  callback-url: http://localhost:8080/api/v1/payments/callback
  connect-timeout-ms: 3000
  request-read-timeout-ms: 5000
  query-read-timeout-ms: 3000

resilience4j:
  retry:
    instances:
      paymentGatewayQuery:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      paymentGateway:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - com.loopers.support.error.CoreException
      paymentGatewayQuery:
        failure-rate-threshold: 50
        minimum-number-of-calls: 6
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        sliding-window-size: 15
        sliding-window-type: COUNT_BASED
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - com.loopers.support.error.CoreException

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false