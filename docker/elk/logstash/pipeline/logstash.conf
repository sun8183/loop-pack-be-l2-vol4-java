input {
  # 파일을 직접 읽지 않고, 서버별 Filebeat 가 보내는 이벤트를 수신
  beats {
    port => 5044
  }
}

filter {
  # Spring Boot 3.4 기본 콘솔 패턴:
  # 2026-10-13T10:00:00.123+09:00  WARN 1234 --- [commerce-api] [nio-8080-exec-1] c.l.a.payment.PaymentFacade : msg
  grok {
    match => {
      "message" => "^%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:level}\s+%{NUMBER:pid}\s+---\s+\[%{DATA:app}\]\s+\[\s*%{DATA:thread}\]\s+(?:\[%{DATA:correlation}\]\s+)?%{NOTSPACE:logger}\s+:\s+%{GREEDYDATA:log_message}"
    }
  }

  # 로그에 찍힌 시각을 이벤트 시각(@timestamp)으로 사용 (수집 시각이 아니라)
  date {
    match => ["log_timestamp", "ISO8601"]
  }

  # Filebeat 컨테이너 기준 파일 경로에서 앱 이름 추출: /logs/commerce-api.log -> commerce-api
  grok {
    match => { "[log][file][path]" => "^/logs/%{DATA:source_app}\.log$" }
    tag_on_failure => []
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
}
